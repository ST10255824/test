name: Deploy - Staging

# Fires when a PR merges into develop (branch protection means CI already passed and the PR
# had at least one approving review — see README "Branching strategy"). Deploys the backend to
# the staging Firebase project and publishes a debug build to internal testers, matching the
# "CD Staging Pipeline Domain" described in Part 1 section 9.3.14.
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy Functions, Firestore & Database rules (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy backend
        run: |
          npx firebase-tools deploy \
            --only functions,firestore:rules,firestore:indexes,database,storage \
            --project "${{ secrets.FIREBASE_PROJECT_ID_STAGING }}" \
            --non-interactive

  build-internal-apk:
    name: Build & distribute internal test APK
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json (staging project)
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON_STAGING }}' | base64 --decode > frontend/app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Distribute to internal testers
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          groups: internal-testers
          file: frontend/app/build/outputs/apk/debug/app-debug.apk

  deploy-admin-web:
    name: Deploy admin web console (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json

      - name: Install & build
        working-directory: frontend/admin-web
        run: |
          npm ci
          npm run build

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project "${{ secrets.FIREBASE_PROJECT_ID_STAGING }}" \
            --non-interactive
